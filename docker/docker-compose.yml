services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vpn_user
      POSTGRES_PASSWORD: vpn_pass
      POSTGRES_DB: vpn_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://vpn_user:vpn_pass@db:5432/vpn_db
      - SECRET_KEY=super-secret-production-key
    restart: always

  dashboard:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../frontend:/usr/share/nginx/html
    restart: always

volumes:
  postgres_data:
