<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магнитошахтинская область</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Courier New', Courier, monospace; color: #888; }
        #instructions {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            cursor: pointer;
            z-index: 10;
        }
        #instructions h1 { font-size: 40px; color: #aaa; text-shadow: 2px 2px #000; text-align: center; }
        #instructions p { font-size: 18px; text-align: center; }
        canvas { display: block; }
        #vhs-noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.04;
            z-index: 5;
        }
    </style>
</head>
<body>
    <div id="instructions">
        <h1>МАГНИТОШАХТИНСКАЯ ОБЛАСТЬ</h1>
        <p>Нажмите, чтобы войти в зону</p>
        <p>(W, A, S, D — Ходьба, Мышь — Обзор)</p>
    </div>
    <canvas id="vhs-noise"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script>
        // Глобальные переменные
        let camera, scene, renderer, controls;
        const objects = [];
        const boundingBoxes = [];
        let raycaster;

        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;

        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        let ashParticles;
        let vhsCanvas, vhsCtx;
        const noiseFrames = [];
        let currentNoiseFrame = 0;
        const basePlayerHeight = 1.7;

        init();
        animate();

        function init() {
            // VHS Noise setup
            vhsCanvas = document.getElementById('vhs-noise');
            vhsCtx = vhsCanvas.getContext('2d');
            resizeVHS();
            pregenerateNoise();

            // Инициализация камеры
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.y = basePlayerHeight;

            // Инициализация сцены
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            // Густой экспоненциальный туман
            scene.fog = new THREE.FogExp2(0x1a1a1a, 0.01);

            // Освещение
            const ambientLight = new THREE.AmbientLight(0x444444, 1.5);
            scene.add(ambientLight);
            const hemiLight = new THREE.HemisphereLight(0x444444, 0x080808, 0.8);
            scene.add(hemiLight);

            // Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Управление
            controls = new THREE.PointerLockControls(camera, document.body);

            const instructions = document.getElementById('instructions');
            instructions.addEventListener('click', () => {
                controls.lock();
            });
            controls.addEventListener('lock', () => {
                instructions.style.display = 'none';
            });
            controls.addEventListener('unlock', () => {
                instructions.style.display = 'flex';
            });

            scene.add(controls.getObject());

            const onKeyDown = (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyD': moveRight = true; break;
                }
            };

            const onKeyUp = (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Создание мира
            createWorld();

            // Обработка изменения размера окна
            window.addEventListener('resize', onWindowResize);
        }

        function resizeVHS() {
            vhsCanvas.width = 256;
            vhsCanvas.height = 256;
        }

        function pregenerateNoise() {
            for (let f = 0; f < 10; f++) {
                const idata = vhsCtx.createImageData(vhsCanvas.width, vhsCanvas.height);
                const buffer = new Uint32Array(idata.data.buffer);
                for (let i = 0; i < buffer.length; i++) {
                    if (Math.random() < 0.05) buffer[i] = 0xffffffff;
                    else buffer[i] = 0x00000000;
                }
                noiseFrames.push(idata);
            }
        }

        function updateVHS() {
            currentNoiseFrame = (currentNoiseFrame + 1) % noiseFrames.length;
            vhsCtx.putImageData(noiseFrames[currentNoiseFrame], 0, 0);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();

            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 400.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 400.0 * delta;

                const oldPosition = controls.getObject().position.clone();

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // Коллизии
                const playerPos = controls.getObject().position;
                const playerBox = new THREE.Box3(
                    new THREE.Vector3(playerPos.x - 1, 0, playerPos.z - 1),
                    new THREE.Vector3(playerPos.x + 1, 10, playerPos.z + 1)
                );

                for (let i = 0; i < boundingBoxes.length; i++) {
                    if (playerBox.intersectsBox(boundingBoxes[i])) {
                        playerPos.copy(oldPosition);
                        break;
                    }
                }

                // Качание камеры
                camera.position.y = basePlayerHeight + Math.sin(time * 0.005) * 0.02;
                camera.position.x = Math.cos(time * 0.01) * 0.005;
            }

            // Анимация пепла
            if (ashParticles) {
                const positions = ashParticles.geometry.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    positions[i] -= 0.15;
                    if (positions[i] < 0) positions[i] = 100;
                }
                ashParticles.geometry.attributes.position.needsUpdate = true;
            }

            // Мерцание фонарей
            scene.traverse((object) => {
                if (object.isPointLight && object.userData.flicker) {
                    if (Math.random() > 0.93) {
                        object.intensity = 0.5 + Math.random() * 2.5;
                    }
                }
            });

            updateVHS();
            prevTime = time;
            renderer.render(scene, camera);
        }

        function createWorld() {
            // Земля
            const groundGeometry = new THREE.PlaneGeometry(2000, 2000);
            const groundMaterial = new THREE.MeshPhongMaterial({ color: 0x1a1a1a });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Материалы
            const boxMat = new THREE.MeshPhongMaterial({ color: 0x2a2a2a });
            const winMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
            const pipeMat = new THREE.MeshPhongMaterial({ color: 0x3a2b21 });
            const fenceMat = new THREE.MeshPhongMaterial({ color: 0x444444 });
            const lepMat = new THREE.MeshPhongMaterial({ color: 0x1a1a1a });

            // Панельки
            const boxGeo = new THREE.BoxGeometry(20, 60, 20);
            const winGeo = new THREE.BoxGeometry(0.8, 0.8, 0.1);

            for (let i = 0; i < 60; i++) {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(
                    Math.floor(Math.random() * 24 - 12) * 40,
                    30,
                    Math.floor(Math.random() * 24 - 12) * 40
                );

                if (Math.abs(box.position.x) < 40 && Math.abs(box.position.z) < 40) continue;

                scene.add(box);
                boundingBoxes.push(new THREE.Box3().setFromObject(box));

                for (let wy = 5; wy < 55; wy += 5) {
                    for (let wx = -8; wx <= 8; wx += 4) {
                        if (Math.random() > 0.5) {
                            const w = new THREE.Mesh(winGeo, winMat);
                            w.position.set(wx, wy - 30, 10.05);
                            box.add(w);
                        }
                        if (Math.random() > 0.5) {
                            const w = new THREE.Mesh(winGeo, winMat);
                            w.position.set(wx, wy - 30, -10.05);
                            box.add(w);
                        }
                    }
                }

                if (Math.random() > 0.4) {
                    const light = new THREE.PointLight(0xffaa00, 2.5, 30);
                    light.position.set(box.position.x, 3, box.position.z + 11);
                    light.userData.flicker = true;
                    scene.add(light);

                    const vis = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.3, 1), winMat);
                    vis.position.set(box.position.x, 3.5, box.position.z + 10.5);
                    scene.add(vis);
                }
            }

            // Трубы
            const pipeGeo = new THREE.CylinderGeometry(0.8, 0.8, 120, 8);
            for (let i = 0; i < 25; i++) {
                const pipe = new THREE.Mesh(pipeGeo, pipeMat);
                pipe.position.set(Math.random() * 800 - 400, 1, Math.random() * 800 - 400);
                pipe.rotation.z = Math.PI / 2;
                pipe.rotation.y = Math.random() * Math.PI;
                scene.add(pipe);
            }

            // Заборы ПО-2
            const fenceGeo = new THREE.BoxGeometry(8, 4, 0.5);
            for (let i = 0; i < 120; i++) {
                const fence = new THREE.Mesh(fenceGeo, fenceMat);
                fence.position.set(Math.random() * 800 - 400, 2, Math.random() * 800 - 400);
                fence.rotation.y = Math.random() * Math.PI;
                scene.add(fence);
                boundingBoxes.push(new THREE.Box3().setFromObject(fence));
            }

            // Опоры ЛЭП
            for (let i = 0; i < 15; i++) {
                createLEP(Math.random() * 800 - 400, Math.random() * 800 - 400, lepMat);
            }

            // Пепел
            const ashGeo = new THREE.BufferGeometry();
            const ashPos = [];
            for (let i = 0; i < 8000; i++) {
                ashPos.push(Math.random() * 600 - 300, Math.random() * 100, Math.random() * 600 - 300);
            }
            ashGeo.setAttribute('position', new THREE.Float32BufferAttribute(ashPos, 3));
            const ashMat = new THREE.PointsMaterial({ color: 0xaaaaaa, size: 0.2, transparent: true, opacity: 0.5 });
            ashParticles = new THREE.Points(ashGeo, ashMat);
            scene.add(ashParticles);
        }

        function createLEP(x, z, material) {
            const group = new THREE.Group();
            const legGeo = new THREE.BoxGeometry(0.3, 40, 0.3);
            for (let i = 0; i < 4; i++) {
                const leg = new THREE.Mesh(legGeo, material);
                const angle = (i / 4) * Math.PI * 2 + Math.PI / 4;
                leg.position.set(Math.cos(angle) * 3, 20, Math.sin(angle) * 3);
                leg.rotation.x = (Math.sin(angle) * 0.1);
                leg.rotation.z = -(Math.cos(angle) * 0.1);
                group.add(leg);
            }
            const crossGeo = new THREE.BoxGeometry(12, 0.3, 0.3);
            const c1 = new THREE.Mesh(crossGeo, material);
            c1.position.y = 30;
            group.add(c1);
            const c2 = new THREE.Mesh(crossGeo, material);
            c2.position.y = 35;
            group.add(c2);
            group.position.set(x, 0, z);
            scene.add(group);
            boundingBoxes.push(new THREE.Box3().setFromObject(group));
        }
    </script>
</body>
</html>
