<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Проверка...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    font-family: Consolas, "Courier New", monospace;
    background: #0d0d0d;
    color: #e6e6e6;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .box {
    max-width: 800px;
    padding: 40px;
    text-align: center;
    border-radius: 12px;
    animation: fadeIn .4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .human {
    background: #0f2a12;
    border: 2px solid #2ecc71;
    color: #8dffa8;
  }

  .bot {
    background: #2a0f0f;
    border: 2px solid #ff2e2e;
    color: #ff8d8d;
  }

  .title {
    font-size: 2rem;
    font-weight: bold;
    margin-bottom: 20px;
    word-break: break-word;
  }

  .reason {
    font-size: 1rem;
    opacity: .75;
    margin-top: 15px;
  }
</style>
</head>
<body>

<div id="result" class="box">
  <div class="title">Проверяем...</div>
</div>

<script>
(function () {
  const resultEl = document.getElementById("result");

  /* ======================
     ПРИЗНАКИ БОТА
     ====================== */

  const botSignatures = [
    // Классические headless и парсеры
    "headlesschrome", "phantomjs", "puppeteer", "playwright",
    "selenium", "webdriver", "htmlunit", "jsdom",
    // Поисковые и SEO-боты
    "googlebot", "bingbot", "yandexbot", "duckduckbot",
    "baiduspider", "ahrefsbot", "semrushbot", "mj12bot",
    "dotbot", "petalbot", "bytespider", "gptbot", "chatgpt",
    "claudebot", "anthropic", "ccbot", "perplexity",
    // Разные краулеры
    "crawler", "spider", "scraper", "curl/", "wget",
    "python-requests", "python-urllib", "aiohttp",
    "axios", "okhttp", "go-http-client", "java/", "libwww",
    "postmanruntime", "insomnia", "httpclient",
    "facebookexternalhit", "telegrambot", "whatsapp",
    "slackbot", "discordbot", "twitterbot", "linkedinbot",
    "applebot", "archive.org_bot", "uptimerobot", "pingdom",
    "statuscake", "nagios", "zabbix", "monitoring",
    // Пустой/подозрительный
    ""
  ];

  let botReasons = [];

  /* 1. Проверка User-Agent */
  const ua = (navigator.userAgent || "").toLowerCase();
  for (const sig of botSignatures) {
    if (sig && ua.includes(sig)) {
      botReasons.push("Обнаружен признак бота в User-Agent: " + sig);
      break;
    }
  }

  /* 2. navigator.webdriver — включается у Selenium / Puppeteer */
  if (navigator.webdriver === true) {
    botReasons.push("navigator.webdriver = true (автоматизированный браузер)");
  }

  /* 3. Нет languages или пустой массив */
  if (!navigator.languages || navigator.languages.length === 0) {
    botReasons.push("navigator.languages пуст");
  }

  /* 4. Нет plugins (у большинства реальных браузеров они есть, у headless — нет) */
  if (navigator.plugins && navigator.plugins.length === 0 && !/firefox/i.test(ua)) {
    botReasons.push("Нет плагинов браузера");
  }

  /* 5. Нет платформы или подозрительная */
  if (!navigator.platform) {
    botReasons.push("navigator.platform отсутствует");
  }

  /* 6. Отсутствует window.chrome у Chrome-подобных UA (частый признак headless) */
  if (/chrome|chromium|edg/i.test(ua) && !window.chrome) {
    botReasons.push("Chrome-UA без window.chrome (headless)");
  }

  /* 7. Очень маленький или пустой экран */
  if (screen.width === 0 || screen.height === 0) {
    botReasons.push("screen пустой");
  }
  if (screen.width < 200 || screen.height < 200) {
    botReasons.push("Слишком маленький экран (возможно headless)");
  }

  /* 8. Размеры окна совпадают с экраном и равны 0 */
  if (window.outerWidth === 0 && window.outerHeight === 0) {
    botReasons.push("outerWidth/outerHeight = 0");
  }

  /* 9. Отсутствие аппаратной конкуренции */
  if (!navigator.hardwareConcurrency || navigator.hardwareConcurrency < 1) {
    botReasons.push("hardwareConcurrency отсутствует");
  }

  /* 10. Отсутствие deviceMemory (у большинства мобильных/десктопов есть) */
  if (navigator.deviceMemory === undefined) {
    botReasons.push("navigator.deviceMemory отсутствует");
  }

  /* 11. Отсутствие touch-событий при мобильном UA */
  const isMobileUA = /android|iphone|ipad|ipod|mobile/i.test(ua);
  if (isMobileUA && !("ontouchstart" in window)) {
    botReasons.push("Мобильный UA без touch-событий");
  }

  /* 12. Несовпадение языков и локали */
  if (navigator.language && navigator.languages &&
      navigator.languages.length > 0 &&
      navigator.languages[0] !== navigator.language) {
    botReasons.push("Несовпадение language/languages[0]");
  }

  /* 13. Отсутствие Referrer при наличии истории */
  // (мягкий признак, в реальной жизни нужен осторожно)
  if (document.referrer === "" && window.history.length > 1) {
    // не считаем это за ошибку — просто закомментировано
  }

  /* ======================
     ВЫВОД
     ====================== */

  function render(isBot) {
    if (isBot) {
      resultEl.className = "box bot";
      resultEl.innerHTML =
        '<div class="title">301 ИДИ НАХРЕН КУСОК ЖЕЛЕЗА BOT DETECTED</div>' +
        '<div class="reason">' + botReasons.map(r => "• " + r).join("<br>") + '</div>';
    } else {
      resultEl.className = "box human";
      resultEl.innerHTML =
        '<div class="title">Проходите вы человек</div>' +
        '<div class="reason">Признаков автоматизации не обнаружено.</div>';
    }
  }

  /* Небольшая задержка, чтобы бот не увидел ответ мгновенно */
  setTimeout(function () {
    render(botReasons.length > 0);
  }, 400);

})();
</script>
</body>
</html>
