<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    font-family: Consolas, "Courier New", monospace;
    background: #0d0d0d;
    color: #e6e6e6;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 16px;
  }

  .box {
    max-width: 800px;
    width: 100%;
    padding: 32px 24px;
    text-align: center;
    border-radius: 12px;
    animation: fadeIn .4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .human {
    background: #0f2a12;
    border: 2px solid #2ecc71;
    color: #8dffa8;
  }

  .bot {
    background: #2a0f0f;
    border: 2px solid #ff2e2e;
    color: #ff8d8d;
  }

  .title {
    font-size: clamp(1.2rem, 4vw, 2rem);
    font-weight: bold;
    margin-bottom: 18px;
    word-break: break-word;
    line-height: 1.3;
  }

  .reason {
    font-size: clamp(.85rem, 3vw, 1rem);
    opacity: .8;
    margin-top: 12px;
    line-height: 1.5;
    text-align: left;
    display: inline-block;
  }
</style>
</head>
<body>

<div id="result" class="box">
  <div class="title">Проверяем...</div>
</div>

<script>
(function () {
  const resultEl = document.getElementById("result");

  /* =========================================================
     0. БАЗОВЫЕ ДАННЫЕ ОБ ОКРУЖЕНИИ
     ========================================================= */
  const ua = (navigator.userAgent || "").toLowerCase();
  const isMobile =
    /android|iphone|ipad|ipod|mobile|mobi|windows phone|opera mini/i.test(ua);

  /* =========================================================
     1. СИЛЬНЫЕ ПРИЗНАКИ (по-настоящему палят автоматизацию)
     ========================================================= */
  const strongSignals = [];

  // 1.1. navigator.webdriver — включается Selenium/Puppeteer/Playwright
  if (navigator.webdriver === true) {
    strongSignals.push("navigator.webdriver = true");
  }

  // 1.2. Классические UA headless/парсеров
  const hardBotUA = [
    "headlesschrome", "phantomjs", "puppeteer", "playwright",
    "selenium", "htmlunit", "jsdom",
    "curl/", "wget",
    "python-requests", "python-urllib", "aiohttp",
    "go-http-client", "java/", "libwww", "okhttp",
    "postmanruntime", "insomnia", "httpclient",
    "gptbot", "chatgpt", "claudebot", "anthropic", "ccbot",
    "perplexity", "bytespider", "petalbot"
  ];
  for (const sig of hardBotUA) {
    if (ua.includes(sig)) {
      strongSignals.push("UA бота: " + sig);
      break;
    }
  }

  // 1.3. Chrome-UA без window.chrome (только на десктопе!)
  //     На Android window.chrome тоже есть, но на всякий случай проверяем !isMobile.
  if (!isMobile && /chrome|chromium|edg/i.test(ua) && !window.chrome) {
    strongSignals.push("Chrome-UA без window.chrome");
  }

  // 1.4. Пустой/нулевой экран
  if (screen.width === 0 || screen.height === 0) {
    strongSignals.push("screen пустой");
  }

  // 1.5. Мобильный UA без touch-событий
  if (isMobile && !("ontouchstart" in window)) {
    strongSignals.push("Мобильный UA без touch-событий");
  }

  /* =========================================================
     2. СЛАБЫЕ ПРИЗНАКИ (сами по себе ничего не значат)
     ========================================================= */
  const weakSignals = [];

  // 2.1. Нет плагинов — ТОЛЬКО на десктопе и НЕ в Firefox/приватных браузерах
  const isFirefox = /firefox/i.test(ua);
  const isPrivateBrowser = /brave|tor|librewolf|waterfox/i.test(ua);
  if (!isMobile && !isFirefox && !isPrivateBrowser &&
      navigator.plugins && navigator.plugins.length === 0) {
    weakSignals.push("Нет плагинов (десктоп)");
  }

  // 2.2. Нет languages
  if (!navigator.languages || navigator.languages.length === 0) {
    weakSignals.push("navigator.languages пуст");
  }

  // 2.3. Нет platform
  if (!navigator.platform) {
    weakSignals.push("navigator.platform отсутствует");
  }

  // 2.4. Очень маленький экран (но не мобильный — там это норма)
  if (!isMobile && (screen.width < 200 || screen.height < 200)) {
    weakSignals.push("Слишком маленький экран");
  }

  // 2.5. outerWidth/Height = 0 (только десктоп)
  if (!isMobile && window.outerWidth === 0 && window.outerHeight === 0) {
    weakSignals.push("outerWidth/Height = 0");
  }

  /* =========================================================
     3. ЛОГИКА ПРИНЯТИЯ РЕШЕНИЯ
     Бот = есть хотя бы 1 сильный признак
           ИЛИ 2+ слабых признака
     ========================================================= */
  const isBot =
    strongSignals.length >= 1 ||
    weakSignals.length >= 2;

  /* =========================================================
     4. РЕНДЕР
     ========================================================= */
  function render() {
    if (isBot) {
      resultEl.className = "box bot";
      const reasons = strongSignals.concat(weakSignals);
      resultEl.innerHTML =
        '<div class="title">301 ИДИ НАХРЕН КУСОК ЖЕЛЕЗА BOT DETECTED</div>' +
        '<div class="reason">' +
          reasons.map(r => "• " + r).join("<br>") +
        '</div>';
    } else {
      resultEl.className = "box human";
      resultEl.innerHTML =
        '<div class="title">Проходите вы человек</div>' +
        '<div class="reason">Признаков автоматизации не обнаружено.</div>';
    }
  }

  /* Небольшая задержка, чтобы бот не получил ответ мгновенно */
  setTimeout(render, 300);

})();
</script>
</body>
</html>
