<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Загрузка...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* Первый экран — красный фон со счётом */
  #countdown-screen {
    position: fixed;
    inset: 0;
    background: red;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-align: center;
    z-index: 10;
  }

  #countdown-text {
    font-size: 2rem;
    margin-bottom: 30px;
    text-shadow: 2px 2px 6px rgba(0,0,0,.5);
  }

  #countdown-number {
    font-size: 10rem;
    font-weight: bold;
    text-shadow: 4px 4px 12px rgba(0,0,0,.6);
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* Второй экран — спиннер загрузки */
  #loading-screen {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }

  .spinner {
    width: 90px;
    height: 90px;
    border: 8px solid rgba(255,255,255,.15);
    border-top: 8px solid #ff0000;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #loading-text {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: black;
    color: white;
    text-align: center;
    padding: 20px;
    font-size: 1.2rem;
    letter-spacing: 1px;
    border-top: 1px solid #222;
  }
</style>
</head>
<body>

  <!-- Экран со счётом -->
  <div id="countdown-screen">
    <div id="countdown-text">Ты будешь зарикролен через....</div>
    <div id="countdown-number">3</div>
  </div>

  <!-- Экран загрузки -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">Redirecting &amp; RickRolling please Wait.....</div>
  </div>

<script>
  const REDIRECT_URL = "https://m.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1&pp=ygUIUmlja1JvbGygBwE%3D";

  const numberEl = document.getElementById("countdown-number");
  const countdownScreen = document.getElementById("countdown-screen");
  const loadingScreen = document.getElementById("loading-screen");

  let count = 3;

  function tick() {
    numberEl.textContent = count;

    if (count === 0) {
      // Показываем экран загрузки
      countdownScreen.style.display = "none";
      loadingScreen.style.display = "flex";

      // Через небольшую паузу — редирект
      setTimeout(() => {
        window.location.href = REDIRECT_URL;
      }, 1500);
      return;
    }

    count--;
    setTimeout(tick, 1000);
  }

  tick();
</script>
</body>
</html>
